name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: h2h
          POSTGRES_PASSWORD: h2h
          POSTGRES_DB: h2h
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U h2h" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:db # loads .env.test (h2h_test on the service above)
      - run: npm run build
        env:
          # Placeholders only: nothing here reaches a real service.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://h2h:h2h@localhost:54329/h2h_test
          APP_URL: http://localhost:3000
          ADMIN_EMAILS: admin@example.com
          EMAIL_FROM: HomeToHome <onboarding@resend.dev>
          RESEND_API_KEY: re_placeholder

  e2e:
    # Needs the Supabase CLI stack (Docker); run by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
